# StreamRecorder Clone — Local Multi-Service Docker Compose
services:
  frontend:
    build:
      context: ./frontend
    image: streamrecorder-frontend:wave-05.5
    restart: unless-stopped
    environment:
      PORT: "3001"
      API_BASE_URL: http://api:3000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:3001"
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./api
    image: streamrecorder-api:wave-05.5
    restart: unless-stopped
    environment:
      PORT: "3000"
      CONFIG_DIR: /data
      RECORDINGS_ROOT: /recordings
      RELATIONAL_STORAGE: "false"
      IDENTITY_MODE: local
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    volumes:
      - ${RUNTIME_DATA_DIR:-./runtime-data}:/data
      - ${RECORDINGS_DIR:-./recordings}:/recordings:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./worker
    image: streamrecorder-worker:wave-05.5
    restart: unless-stopped
    init: true
    environment:
      CONFIG_DIR: /data
      OUTPUT_DIR: /recordings
      PERSISTENCE_MODE: direct_json
      POLL_INTERVAL: "${WORKER_POLL_INTERVAL:-60}"
    volumes:
      - ${RUNTIME_DATA_DIR:-./runtime-data}:/data
      - ${RECORDINGS_DIR:-./recordings}:/recordings
