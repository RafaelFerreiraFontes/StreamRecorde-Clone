services:
  frontend:
    build:
      context: ./frontend
    image: streamrecorder-frontend:wave-03.5
    restart: unless-stopped
    environment:
      PORT: "3001"
      API_BASE_URL: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./api
    image: streamrecorder-api:wave-03.5
    restart: unless-stopped
    environment:
      PORT: "3000"
      CONFIG_DIR: /data
    ports:
      - "3000:3000"
    volumes:
      - ./runtime-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./worker
    image: streamrecorder-worker:wave-03.5
    restart: unless-stopped
    init: true
    environment:
      CONFIG_DIR: /data
      OUTPUT_DIR: /recordings
      POLL_INTERVAL: "60"
    volumes:
      - ./runtime-data:/data
      - ./recordings:/recordings
